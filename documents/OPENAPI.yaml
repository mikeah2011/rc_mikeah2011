openapi: 3.0.3
info:
  title: HTTP Notifications API
  version: 0.1.0
  description: |
    内部 HTTP(S) 通知服务，持久化后异步投递，支持有限重试与人工重投。
    默认 Outbox + database queue。202 不代表供应商已收到请求；不保证外部业务恰好执行一次。
    调用方鉴权及生产安全约束尚待完善，不应直接对公网开放。
servers:
  - url: http://localhost:8000
paths:
  /api/notifications:
    post:
      summary: 提交通知请求（异步投递）
      parameters:
        - name: X-Client-Id
          in: header
          description: 调用方标识，优先于请求体 client_id；不是鉴权凭据
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: 提交幂等键，优先于请求体 idempotency_key；不等于供应商业务幂等
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, method]
              properties:
                client_id:
                  type: string
                  description: 客户端标识（可通过 X-Client-Id header 提供）
                idempotency_key:
                  type: string
                  description: 幂等键
                url:
                  type: string
                  format: uri
                  pattern: '^https?://'
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
                headers:
                  type: object
                  additionalProperties:
                    type: string
                body:
                  type: string
                  description: 原始请求字符串，保留首尾空白，投递时不进行 JSON 二次编码
      responses:
        '202':
          description: Accepted（请求及投递意图已持久化，等待异步投递）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '200':
          description: 已存在（幂等键命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '409':
          description: 同一调用方的幂等键已用于不同请求内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Laravel 请求字段验证失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
  /api/notifications/{id}/retry:
    post:
      summary: 人工重投（仅对 failed 状态）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Accepted（新轮次及投递意图已持久化，等待异步重投）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          description: 未找到通知
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态冲突（非 failed）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, delivered, failed]
        delivery_round:
          type: integer
    NotificationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Notification'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            details:
              type: object
